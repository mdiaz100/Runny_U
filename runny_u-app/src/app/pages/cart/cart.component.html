<div class="cart-container" *ngIf="items.length > 0; else emptyCart">
    <h2>Carrito de compras</h2>
    <ul>
      <li *ngFor="let item of items" class="cart-item">
        <img [src]="item.image" alt="{{ item.name }}" width="80" />
        <div>
          <strong>{{ item.name }}</strong><br />
          ${{ item.price }} x {{ item.quantity }} = ${{ item.price * item.quantity }}
        </div>
        <div class="controls">
          <button (click)="onDecreaseQuantity(item)">-</button>
          <span>{{ item.quantity }}</span>
          <button (click)="onIncreaseQuantity(item)">+</button>
          <button (click)="onRemoveItem(item)">🗑️</button>
        </div>
      </li>
    </ul>
    <h3>Total: ${{ onGetTotal() }}</h3>
    <button (click)="onClearCart()">Vaciar carrito</button>
  </div>
  
  <ng-template #emptyCart>
    <p>El carrito está vacío.</p>
  </ng-template>
