<div class="auth-container">
  <div class="auth-image">
    <img src="assets/logos/logoudm.png" alt="Logo" class="auth-logo" />
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/logos/logorunny.png" alt="Logo" class="auth-logo">
      <h1>Inicia sesión en <span>Runny U</span></h1>
      <p>Usa tu correo institucional</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="input-group">
        <label for="email"><i class="fas fa-envelope"></i> Correo electrónico</label>
        <input type="email" id="email" formControlName="email" required />
      </div>

      <div class="input-group password-input">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" required />
        <button type="button" class="toggle-password">
          <i class="fas fa-eye"></i>
        </button>
      </div>

      <div class="options-group">
        <div class="remember-me">
          <input type="checkbox" id="remember" />
          <label for="remember">Recuérdame</label>
        </div>
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="auth-button">Iniciar sesión</button>
    </form>
